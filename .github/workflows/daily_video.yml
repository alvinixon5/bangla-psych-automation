name: Mind Decode Bangla - 2x Daily Video Automation

on:
  schedule:
    # দুপুর ২:১৭টা বাংলাদেশ সময় (08:17 UTC)
    - cron: '17 8 * * *'
    # রাত ৮:১৭টা বাংলাদেশ সময় (14:17 UTC)
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Bengali Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-noto-core
          sudo apt-get install -y fonts-lohit-bengali || true
          mkdir -p fonts
          curl -fL -s "https://raw.githubusercontent.com/google/fonts/main/ofl/hindsiliguri/HindSiliguri-Bold.ttf" -o fonts/BanglaBold.ttf || true
          fc-cache -fv

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Video Generation & Multi-Platform Upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: python main.py

      - name: Upload Generated Thumbnail & Videos as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mind-decode-media-${{ github.run_number }}
          path: |
            temp/thumb_yt.jpg
            temp/video_fb.mp4
          retention-days: 3

      - name: Save Updated History & Queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json scripts_queue.json
          git diff --staged --quiet || git commit -m "Update posted history and script queue"
          git push
